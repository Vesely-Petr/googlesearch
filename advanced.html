<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <title>Advanced Search</title>
        <link rel="stylesheet" href="styles.css">
    </head>
    <body>
        <div class="header">
            <a href="index.html">Google Search</a>
        </div>
        <h1>Advanced Search</h1>
        <form action="https://www.google.com/search">
            <p>
                <label for="as_q">all these words:</label>
                <input type="text" name="as_q" id="as_q">
            </p>
            <p>
                <label for="as_epq">this exact word or phrase:</label>
                <input type="text" name="as_epq" id="as_epq">
            </p>
            <p>
                <label for="as_oq">any of these words:</label>
                <input type="text" name="as_oq" id="as_oq">
            </p>
            <p>
                <label for="as_eq">none of these words:</label>
                <input type="text" name="as_eq" id="as_eq">
            </p>
            <input type="submit" value="Advanced Search" class="blue-button">
        </form>
        <p class="badges">
            <a href="https://validator.w3.org/nu/?doc=https://vesely-petr.github.io/googlesearch/advanced.html"><img src="https://www.w3.org/html/logo/badge/html5-badge-h-solo.png" alt="Valid HTML" width="31" height="31"></a>
            <a href="https://jigsaw.w3.org/css-validator/validator?uri=https://vesely-petr.github.io/googlesearch/styles.css"><img src="https://jigsaw.w3.org/css-validator/images/vcss" alt="Valid CSS" width="88" height="31"></a>
        </p>
    </body>
</html>
